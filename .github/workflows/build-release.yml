name: Build And Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libx11-dev \
            libxdo-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxkbcommon-dev

      - name: Verify ALSA pkg-config path
        if: runner.os == 'Linux'
        run: |
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          pkg-config --modversion alsa

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/aitotype/src-tauri

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: src/aitotype/src-tauri
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_VERSION#v}"
          export VERSION
          echo "Syncing app version to ${VERSION}"
          node -e 'const fs = require("fs"); const p = "Cargo.toml"; let s = fs.readFileSync(p, "utf8"); s = s.replace(/(\[package\][\s\S]*?\nversion\s*=\s*)"[^"]+"/, (m, a) => a + "\"" + process.env.VERSION + "\""); fs.writeFileSync(p, s);'

      - name: Build (release)
        working-directory: src/aitotype/src-tauri
        run: cargo build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aitotype-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            src/aitotype/src-tauri/target/release/aitotype
            src/aitotype/src-tauri/target/release/aitotype.exe

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: aitotype-windows-latest
          path: dist

      - name: Create Release and upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.exe