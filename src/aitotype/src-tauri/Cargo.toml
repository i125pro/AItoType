[package]
name = "aitotype"
version = "0.1.0"
description = "AItoType - 轻量级语音转文字工具（egui 原生版，无 WebView2）"
authors = ["you"]
edition = "2021"
default-run = "aitotype"

[[bin]]
name = "aitotype"
path = "src/main.rs"

[dependencies]
# 原生 GUI（egui/eframe）：纯 GPU 渲染，不再依赖 WebView / WebView2
eframe = "0.29"

# 全局快捷键（原 tauri-plugin-global-shortcut 的等价替代）
global-hotkey = "0.6"

# 系统托盘（原 tauri tray-icon 的等价替代）
tray-icon = "0.19"

# 托盘图标解码
image = { version = "0.25", default-features = false, features = ["png"] }

# 配置 / 日志目录解析（替代 tauri path API）
dirs = "5"

# 音频录制
cpal = "0.15"
hound = "3.5"

# 模拟键盘输入
enigo = "0.2"

# HTTP 请求（STT / Enhancement / 更新检查）
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

# 剪贴板
arboard = "3"

# 环境变量
dotenv = "0.15"

# Base64 编码
base64 = "0.22"

# 异步 trait
async-trait = "0.1"
chrono = "0.4"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 全局状态
lazy_static = "1.4"
aho-corasick = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true